name: Build WETrace Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/wetrace-icon-512.png"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare desktop icon
        shell: pwsh
        run: Copy-Item public/wetrace-icon-512.png desktop/icon.png -Force

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Show desktop output
        shell: pwsh
        run: Get-ChildItem -Recurse dist-desktop | Select-Object FullName,Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WETrace-Desktop-1.0.1-Windows
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "wetrace-desktop-v1.0.1"
          $exe = Get-ChildItem dist-desktop -Filter "*.exe" | Select-Object -First 1
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe.FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "WETrace Desktop 1.0.1" --notes "WETrace Desktop for Windows. Install the EXE to launch the live secure WETrace platform from your desktop."
          } else {
            gh release upload $tag $exe.FullName --repo "${{ github.repository }}" --clobber
          }
