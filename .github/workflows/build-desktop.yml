name: Build WETrace Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - "public/wetrace-icon-512.png"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows desktop app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:build:win

      - name: Show desktop output
        shell: pwsh
        run: Get-ChildItem -Recurse dist-desktop | Select-Object FullName,Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WETrace-Desktop-1.0.0-Windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "wetrace-desktop-v1.0.0"
          $exe = Get-ChildItem dist-desktop -Filter "*.exe" | Select-Object -First 1
          $zip = Get-ChildItem dist-desktop -Filter "*.zip" | Select-Object -First 1
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe.FullName $zip.FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "WETrace Desktop 1.0.0" --notes "WETrace Desktop for Windows. Includes the Windows installer and portable ZIP build. The desktop app connects securely to the live WETrace platform."
          } else {
            gh release upload $tag $exe.FullName $zip.FullName --repo "${{ github.repository }}" --clobber
          }
