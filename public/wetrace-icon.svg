<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WETrace app icon</title>
  <desc id="desc">A global investigation lens with connected evidence nodes on a midnight navy field.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#0D3554"/>
      <stop offset="55%" stop-color="#071B2F"/>
      <stop offset="100%" stop-color="#04111F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE39A"/>
      <stop offset="45%" stop-color="#E9A23B"/>
